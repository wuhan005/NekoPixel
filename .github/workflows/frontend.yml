name: Build frontend
on:
  release:
    types:
      - published

jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        working-directory: web
        run: pnpm install
      - name: Build
        working-directory: web
        run: pnpm run build
      - name: Archive
        run: zip -r fe-production.zip web/dist
      - name: Upload to release
        uses: svenstaro/upload-release-action@2.5.0
        with:
          file: fe-production.zip
          overwrite: true
          tag: ${{ github.event.release.tag_name }}

  umd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install dependencies
        working-directory: web
        run: pnpm install
      - name: Build
        working-directory: web
        run: pnpm run umd
      - name: Archive
        run: zip -r fe-umd.zip web/dist
      - name: Upload to release
        uses: svenstaro/upload-release-action@2.5.0
        with:
          file: fe-umd.zip
          overwrite: true
          tag: ${{ github.event.release.tag_name }}
      - name: Publish @e99p1ant/neko-pixel-umd
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          mkdir -p package-umd
          cp web/dist/neko-pixel-app.umd.js web/dist/neko-pixel-app.es.js web/dist/style.css package-umd/
          cp package.json package-umd/
          cd package-umd
          npm publish --access public
      - name: Publish @e99p1ant/neko-pixel
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          mkdir -p package-vue
          cp web/dist/neko-pixel-app.umd.js web/dist/neko-pixel-app.es.js web/dist/style.css package-vue/
          cp web/dist/neko-pixel-app.es.d.ts package-vue/index.d.ts
          cp package.vue.json package-vue/package.json
          cd package-vue
          npm publish --access public
